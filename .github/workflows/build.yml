name: Sestavení návodů

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nástroje
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils
          pip install playwright
          python -m playwright install --with-deps chromium
          mkdir -p ~/.local/share/fonts && cp _build/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f

      - name: Sestavení PDF a ZIP
        run: python3 _build/build.py

      - name: Kontrola, že README odpovídají kódu
        run: git diff --exit-code -- '*.md' || (echo "::warning::README.md se liší od .ino – spusť build lokálně a commitni"; true)

      - name: Uložit výstupy
        uses: actions/upload-artifact@v4
        with:
          name: navody
          path: |
            */vystup/*.pdf
            */vystup/*.zip

      - name: Přiložit k vydání (jen pro tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */vystup/*.pdf
            */vystup/*.zip
